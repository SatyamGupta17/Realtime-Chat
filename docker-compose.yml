services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/global-schema.sql:/docker-entrypoint-initdb.d/01-global-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-shard-1:
    image: postgres:16
    container_name: chat-postgres-shard-1
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: chat_shard_1
    volumes:
      - postgres_shard_1_data:/var/lib/postgresql/data
      - ./database/shard-schema.sql:/docker-entrypoint-initdb.d/01-shard-schema.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d chat_shard_1"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-shard-2:
    image: postgres:16
    container_name: chat-postgres-shard-2
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: chat_shard_2
    volumes:
      - postgres_shard_2_data:/var/lib/postgresql/data
      - ./database/shard-schema.sql:/docker-entrypoint-initdb.d/01-shard-schema.sql:ro
    ports:
      - "5434:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d chat_shard_2"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --create \
          --if-not-exists \
          --topic chat.messages \
          --partitions 1 \
          --replication-factor 1 \
          --bootstrap-server kafka:9092

        echo "Kafka topic chat.messages ready"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api

    environment:
      API_PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SHARD1_DB_HOST: postgres-shard-1
      SHARD1_DB_PORT: 5432
      SHARD2_DB_HOST: postgres-shard-2
      SHARD2_DB_PORT: 5432

      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}

    depends_on:
      postgres:
        condition: service_healthy

      postgres-shard-1:
        condition: service_healthy

      postgres-shard-2:
        condition: service_healthy

    ports:
      - "3000:3000"

  edge-1:
    build:
      context: .
      dockerfile: Dockerfile.edge
    environment:
      EDGE_ID: edge-1
      PORT: 4001
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BROKER: kafka:9092
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "4001:4001"

  edge-2:
    build:
      context: .
      dockerfile: Dockerfile.edge
    environment:
      EDGE_ID: edge-2
      PORT: 4002
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BROKER: kafka:9092
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "4002:4002"

  edge-3:
    build:
      context: .
      dockerfile: Dockerfile.edge
    environment:
      EDGE_ID: edge-3
      PORT: 4003
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BROKER: kafka:9092
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "4003:4003"
 
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SHARD1_DB_HOST: postgres-shard-1
      SHARD1_DB_PORT: 5432
      SHARD2_DB_HOST: postgres-shard-2
      SHARD2_DB_PORT: 5432
      KAFKA_BROKER: kafka:9092

    depends_on:
      postgres:
        condition: service_healthy
      postgres-shard-1:
        condition: service_healthy
      postgres-shard-2:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    depends_on:
      - edge-1
      - edge-2
      - edge-3
    ports:
      - "8080:8080"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
        VITE_WS_URL: ws://localhost:8080
    depends_on:
      - api
      - nginx
    ports:
      - "5173:80"

volumes:
  postgres_data:
  postgres_shard_1_data:
  postgres_shard_2_data: